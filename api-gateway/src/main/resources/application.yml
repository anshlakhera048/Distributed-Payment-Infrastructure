server:
  port: 8090

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    gateway:
      # Global defaults
      default-filters:
        # Propagate X-Correlation-ID downstream (generated by RequestEnrichmentFilter)
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 100       # tokens added per second
            redis-rate-limiter.burstCapacity: 200        # max burst
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@remoteAddrKeyResolver}"

      routes:
        # ----------------------------------------------------------------
        # Payment Service routes
        # ----------------------------------------------------------------
        - id: payment-service-api
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/api/payments/**
          filters:
            - StripPrefix=1
            # Per-route rate limit — tighter limit for payment mutations
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@remoteAddrKeyResolver}"
            # Retry on 502/503/504 (gateway or service restart)
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false
            # Circuit breaker — opens after failures accumulate
            - name: CircuitBreaker
              args:
                name: payment-service-cb
                fallbackUri: forward:/fallback/payment-service

        # ----------------------------------------------------------------
        # Actuator / metrics (no rate limiting — internal only)
        # ----------------------------------------------------------------
        - id: payment-service-health
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/management/**
          filters:
            - StripPrefix=0

# ----------------------------------------------------------------
# JWT — symmetric HS256 key
# ----------------------------------------------------------------
app:
  jwt:
    secret: ${GATEWAY_JWT_SECRET:changeme-replace-in-production-min-32-chars}

# ----------------------------------------------------------------
# Actuator
# ----------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
  metrics:
    tags:
      application: api-gateway

# ----------------------------------------------------------------
# Logging
# ----------------------------------------------------------------
logging:
  level:
    root: INFO
    com.payments.gateway: DEBUG
    org.springframework.cloud.gateway: WARN
    reactor.netty: WARN
